name: Publish verified release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.5.1)
        required: true
      android_run:
        description: Successful Android signed APK run ID
        required: true
      windows_run:
        description: Successful Windows feature checks run ID
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      ANDROID_RUN: ${{ inputs.android_run }}
      WINDOWS_RUN: ${{ inputs.windows_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful builds match the release tag
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-touch\.[1-9][0-9]*)?', tag):
              raise SystemExit('Use a semantic version release tag')
          sha = subprocess.check_output(['git', 'rev-parse', tag + '^{commit}'], text=True).strip()
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/main'], check=True)
          present = subprocess.run(['git', 'cat-file', '-e', tag + ':release.json'], capture_output=True).returncode == 0
          identity = json.loads(subprocess.check_output(['git', 'show', tag + ':release.json'])) if present else dict(tag=tag,display_version=tag[1:],windows_build_version=tag[1:])
          if identity['tag'] != tag or not all(re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', identity[key]) for key in ('display_version','windows_build_version')):
              raise SystemExit('Release tag is not bound to the tagged version metadata')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('EXPECTED_DISPLAY_VERSION=' + identity['display_version'] + '\n')
              env.write('EXPECTED_WINDOWS_BUILD=' + identity['windows_build_version'] + '\n')
          selected = {}
          deadline = time.monotonic() + 900
          builds = [('ANDROID_RUN', 'android-release.yml'), ('WINDOWS_RUN', 'windows-features.yml')]
          while any(not os.environ.get(variable) and variable not in selected for variable, _ in builds):
              endpoint = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs?head_sha=' + sha + '&per_page=100'
              runs = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))['workflow_runs']
              for variable, workflow in builds:
                  matches = [run for run in runs if run['head_sha'] == sha and run['path'] == '.github/workflows/' + workflow and run['conclusion'] == 'success' and run['event'] in ('push','workflow_dispatch')]
                  if matches:selected[variable] = str(max(matches,key=lambda run:run['id'])['id'])
              if all(os.environ.get(variable) or variable in selected for variable,_ in builds):break
              if time.monotonic() >= deadline:raise SystemExit('Timed out waiting for successful builds of the tagged source')
              time.sleep(15)
          for variable, workflow in builds:
              run_id = os.environ.get(variable) or selected[variable]
              if not run_id.isdecimal():
                  raise SystemExit('Invalid workflow run ID')
              endpoint = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + run_id
              run = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
              if run['conclusion'] != 'success' or run['head_sha'] != sha or run['path'] != '.github/workflows/' + workflow:
                  raise SystemExit('Build must succeed on the exact tagged source: ' + variable)
              with open(os.environ['GITHUB_ENV'], 'a') as env:env.write(variable + '=' + run_id + '\n')
          if not Path('docs/releases/' + tag + '.md').is_file():
              raise SystemExit('Missing reviewed release notes')
          print('Both successful builds match ' + tag + ' at ' + sha)
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.ANDROID_RUN }}
          pattern: LanCmd-signed-Android-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.WINDOWS_RUN }}
          pattern: LanCmd-Windows-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.ANDROID_RUN }}
          pattern: Android-test-reports-*
          merge-multiple: true
          path: test-reports
      - name: Verify artifacts and prepare checksums
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import struct
          import subprocess
          import xml.etree.ElementTree as ET
          import zipfile

          tag = os.environ['RELEASE_TAG']
          version = tag[1:]
          output = Path('dist')
          apk = output / ('LanCmd-' + version + '.apk')
          archive = output / ('LanCmd-Windows-' + version + '.zip')
          expected = (output / 'SHA256SUMS-Android.txt').read_text().split()
          if expected != [hashlib.sha256(apk.read_bytes()).hexdigest(), apk.name]:
              raise SystemExit('Android checksum differs from signed build')
          reports = list(Path('test-reports').glob('TEST-*.xml'))
          if not reports:
              raise SystemExit('Missing Android test results')
          tests = 0
          for report in reports:
              suite = ET.parse(report).getroot()
              tests += int(suite.get('tests', 0))
              if any(int(suite.get(key, 0)) for key in ('failures', 'errors', 'skipped')):
                  raise SystemExit('Android tests must pass without skipped tests')
          if not tests:
              raise SystemExit('No Android tests executed')
          with zipfile.ZipFile(archive) as package:
              if package.testzip() is not None:
                  raise SystemExit('Damaged Windows archive')
              import json
              manifest = json.loads(package.read('LanCmd-Windows/release-manifest.json'))
              if manifest.get('product') != 'LanCmd-Windows' or manifest.get('version') != os.environ['EXPECTED_WINDOWS_BUILD'] or manifest.get('arch') != 'amd64':
                  raise SystemExit('Invalid local upgrade manifest')
              if manifest.get('display_version',manifest['version']) != os.environ['EXPECTED_DISPLAY_VERSION']:
                  raise SystemExit('Windows display version differs from tagged identity')
              for name, item in manifest['files'].items():
                  data = package.read('LanCmd-Windows/' + name)
                  if len(data) != item['size'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                      raise SystemExit('Local upgrade checksum mismatch: ' + name)
              if not package.read('LanCmd-Windows/upgrade/README.txt'):
                  raise SystemExit('Missing local upgrade directory')
              for name in ('lan_command_agent.py', 'remote_features.py', 'system_controls.py', 'input_guard.py', 'device_management.py', 'touch_guard.py', 'file_actions.py', 'desktop_apps.py', 'command_queue.py', 'recordings.py', 'gestures.py', 'text_editor.py', 'app_locks.py', 'app_catalog.py', 'app_freeze.py', 'wallpaper.py', 'local_upgrade.py', 'registry_editor.py', 'task_manager.py', 'browser_control.py', 'script_runner.py', 'privacy_devices.py', 'placeholder_files.py', 'file_jobs.py', 'file_schedule.py', 'document_open.py', 'file_search.py', 'device_property_change.py', '使用说明.txt'):
                  source = subprocess.check_output(['git', 'show', tag + ':windows/' + name])
                  if package.read('LanCmd-Windows/' + name) != source:
                      raise SystemExit('Windows package differs from tagged source: ' + name)
              for name in ('python/_sqlite3.pyd', 'python/sqlite3.dll'):
                  if not package.read('LanCmd-Windows/' + name):
                      raise SystemExit('Missing SQLite runtime: ' + name)
              for name in ('storage_reads.py', 'cursor_visibility.py', 'force_delete.py', 'startup_network.py', 'touch_injection.py', 'network_management.py', 'native_wifi.py', 'network_winrt.ps1', 'start.bat'):
                  if name in ('touch_injection.py', 'network_management.py', 'native_wifi.py', 'network_winrt.ps1') and subprocess.run(['git', 'cat-file', '-e', tag + ':windows/' + name],capture_output=True).returncode:
                      continue
                  source = subprocess.check_output(['git', 'show', tag + ':windows/' + name])
                  if name == 'start.bat':
                      # Match .gitattributes: Git stores LF, checkout/package uses CRLF.
                      source = source.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
                  if package.read('LanCmd-Windows/' + name) != source:
                      raise SystemExit('Windows startup file differs from tagged source: ' + name)
              for name in ('Start.exe', 'LanCmdAgent.exe', 'LanCmdCtl.exe', 'LanCmdCapture.exe', 'LanCmdRecord.exe'):
                  data = package.read('LanCmd-Windows/' + name)
                  pe = struct.unpack_from('<I', data, 0x3c)[0]
                  if data[:2] != b'MZ' or data[pe:pe + 4] != b'PE\0\0' or struct.unpack_from('<H', data, pe + 4)[0] != 0x8664:
                      raise SystemExit('Invalid Windows x64 executable: ' + name)
          checksums = ''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n' for path in (apk, archive))
          (output / ('SHA256SUMS-' + version + '.txt')).write_text(checksums)
          print('Verified ' + str(tests) + ' Android tests and both release packages')
          print(checksums)
      - name: Publish installation packages
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          title="LanCmd $version"
          if [ "$version" != "$EXPECTED_DISPLAY_VERSION" ]; then title="LanCmd $EXPECTED_DISPLAY_VERSION（原生触控版）"; fi
          notes="docs/releases/$RELEASE_TAG.md"
          assets=("dist/LanCmd-$version.apk" "dist/LanCmd-Windows-$version.zip" "dist/SHA256SUMS-$version.txt")
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest --title "$title" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --verify-tag --latest --title "$title" --notes-file "$notes" "${assets[@]}"
          fi
          gh release view "$RELEASE_TAG" --json url,tagName,isDraft,assets
