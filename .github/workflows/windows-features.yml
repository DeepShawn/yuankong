name: Windows feature checks
on:
  push:
    paths:
      - windows/**
      - tools/test_*.py
      - tools/start_panel_harness.c
      - .github/workflows/windows-features.yml
  pull_request:
    paths:
      - windows/**
      - tools/test_*.py
      - tools/start_panel_harness.c
      - .github/workflows/windows-features.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build capture helper
        shell: cmd
        run: cl /nologo /O2 /EHsc /std:c++17 /Fe:windows\LanCmdCapture.exe windows\capture.cpp /link windowscodecs.lib mf.lib mfreadwrite.lib mfplat.lib mfuuid.lib ole32.lib gdi32.lib user32.lib uuid.lib
      - name: Build console launcher
        shell: cmd
        run: cl /nologo /O2 /W3 /DUNICODE /D_UNICODE /DLANCMD_CONSOLE /Fe:windows\LanCmdCtl.exe windows\launcher.c /link shell32.lib user32.lib
      - name: Build native recorder
        shell: cmd
        run: cl /nologo /O2 /EHsc /std:c++17 /Fe:windows\LanCmdRecord.exe windows\record.cpp /link mf.lib mfreadwrite.lib mfplat.lib mfuuid.lib ole32.lib gdi32.lib user32.lib winmm.lib uuid.lib
      - name: Launcher argument regression
        run: python -m unittest discover -s tools -p test_launcher.py -v
      - name: Build visible panel and native regression harness
        shell: cmd
        run: |
          cl /nologo /O2 /W3 /DUNICODE /D_UNICODE /Fe:windows\Start.exe windows\start_panel.c /link /SUBSYSTEM:WINDOWS advapi32.lib ws2_32.lib shell32.lib comctl32.lib user32.lib gdi32.lib
          if errorlevel 1 exit /b 1
          if not exist windows\build-win mkdir windows\build-win
          cl /nologo /O2 /W3 /LD /DUNICODE /D_UNICODE /Fe:windows\build-win\StartPanelTest.dll tools\start_panel_harness.c /link advapi32.lib ws2_32.lib shell32.lib comctl32.lib user32.lib gdi32.lib
          if errorlevel 1 exit /b 1
      - name: Panel privilege and cancellation regression
        run: python -m unittest discover -s tools -p test_panel.py -v
      - name: Process privilege metadata regression
        run: python -m unittest discover -s tools -p test_process_metadata.py -v
      - name: File transfer regression
        run: python -m unittest discover -s tools -p test_file_operations.py -v
      - name: Pointer input and cleanup regression
        run: python -m unittest discover -s tools -p test_pointer.py -v
      - name: Session isolation and revocation
        run: python -m unittest discover -s tools -p test_remote_features.py -v
      - name: Native Windows features
        run: python -m unittest discover -s tools -p test_windows_features.py -v
      - name: Volume and local input recovery
        run: python -m unittest discover -s tools -p test_system_controls.py -v
      - name: Removable devices and reversible policies
        run: python -m unittest discover -s tools -p test_device_management.py -v
      - name: Desktop apps, ZIP previews, ordered commands and touch recovery
        run: python -m unittest discover -s tools -p test_workbench.py -v
      - name: Recordings, native media encoding and gesture playback
        run: python -m unittest discover -s tools -p test_recordings.py -v
      - name: Text editor, native permissions, registry, scripts and privacy devices
        run: python -m unittest discover -s tools -p "test_management*.py" -v
      - name: Application lock and privacy device recovery edge checks
        run: python -m unittest discover -s tools -p test_privacy_lock_edges.py -v
      - name: Allocated placeholder files, cancellation and crash cleanup
        run: python -m unittest discover -s tools -p test_placeholder_files.py -v
  package-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        timeout-minutes: 5
        run: |
          # A stalled runner mirror must not consume the entire packaging job.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/apt-security-mirrors.txt ]; then
            echo 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-security-mirrors.txt >/dev/null
          fi
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update -qq
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build Windows distribution
        run: bash windows/build_windows_exe.sh
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: LanCmd-Windows-${{ github.run_number }}
          path: dist/LanCmd-Windows-*.zip
          if-no-files-found: error
          retention-days: 14
