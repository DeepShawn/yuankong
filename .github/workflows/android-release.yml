name: Android signed APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: python
        run: |
          import os
          names = ('KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure the four Android signing secrets before running this workflow')
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 不再使用 android-actions/setup-android：
      # 该 action 会执行 `sdkmanager tools`，而 cmdline-tools 16.0 已移除该包，
      # 直接报 "Failed to find package 'tools'" 导致整个 job 失败。
      # ubuntu-latest 自带 Android SDK，这里只用预装的 sdkmanager 装所需组件。
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path

          names = ('KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Missing Android signing secrets')
          keystore = Path(os.environ['RUNNER_TEMP']) / 'lancmd-release.jks'
          keystore.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          keystore.chmod(0o600)
          def escape(value):
              encoded = value.encode('utf-16-be')
              return ''.join('\\u%04x' % int.from_bytes(encoded[i:i + 2], 'big') for i in range(0, len(encoded), 2))
          values = {
              'storeFile': str(keystore),
              'storePassword': os.environ['KEYSTORE_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD'],
          }
          config = Path('android/keystore.properties')
          config.write_text(''.join(name + '=' + escape(value) + '\n' for name, value in values.items()))
          config.chmod(0o600)
      - name: Build signed APK
        working-directory: android
        run: bash gradlew :app:assembleRelease --console=plain --max-workers=2
      - name: Verify signature and prepare artifact
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          apk = Path('android/app/build/outputs/apk/release/app-release.apk')
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '35.0.0'
          report = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          expected = '0e3f1973d35093280b1bf018af86bafb957a1048b529cfe1954638f10f4a1fed'
          if 'Signer #1 certificate SHA-256 digest: ' + expected not in report:
              raise SystemExit('APK certificate differs from the 1.4.10 release certificate')
          subprocess.run([str(tools / 'zipalign'), '-c', '-P', '16', '4', str(apk)], check=True)
          metadata = subprocess.check_output([str(tools / 'aapt2'), 'dump', 'badging', str(apk)], text=True)
          version = re.search(r"versionName='([0-9.]+)'", metadata).group(1)
          if os.environ['GITHUB_REF'].startswith('refs/tags/') and os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Git tag and Android version do not match')
          output = Path('dist')
          output.mkdir(exist_ok=True)
          destination = output / ('LanCmd-' + version + '.apk')
          shutil.copyfile(apk, destination)
          digest = hashlib.sha256(destination.read_bytes()).hexdigest()
          (output / 'SHA256SUMS-Android.txt').write_text(digest + '  ' + destination.name + '\n')
          print('Verified Android ' + version + ' with the 1.4.10 signing certificate')
      - name: Remove signing material
        if: always()
        run: rm -f android/keystore.properties "$RUNNER_TEMP/lancmd-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: LanCmd-signed-Android-${{ github.run_number }}
          path: |
            dist/LanCmd-*.apk
            dist/SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 14
